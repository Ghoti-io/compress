# Continuous integration for ghoti.io-compress.
#
# Everything here is a target the Makefile already had, run the way the
# project documents it. The point of the file is that they are all run, on
# every change, rather than when somebody remembers: this library shipped two
# defects that a green local `make test` did not see - an encoder that lost
# staged output, and an LZW decoder that could not stream at all - and both
# were found by running something that was not being run.
#
# The layout follows ../text's workflow, which is the only precedent in the
# suite: the project is checked out into a subdirectory so that cutil can be
# checked out beside it rather than inside it, and both are installed into one
# prefix in the workspace, exactly the way ../bootstrap.sh does it locally.
# The steps common to every job are in .github/actions/setup.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A branch that is pushed twice in quick succession does not need the first
# run finished. Pull requests are cancelled; pushes to master are not, so that
# every commit on the branch keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PREFIX: ${{ github.workspace }}/.local
  PKG_CONFIG_PATH: ${{ github.workspace }}/.local/share/pkgconfig

jobs:
  # ---------------------------------------------------------------------------
  # The everyday gate: it builds, the symbols are namespaced, the tests pass,
  # the examples still compile, and what `make install` leaves behind can
  # actually be consumed.
  #
  # Both compilers, because -Werror is only as good as the warnings the
  # compiler in use happens to emit, and the two disagree about which ones
  # those are. Neither is pinned: whatever the runner image ships is a third
  # opinion on top of the GCC 14 the suite is developed against, and a warning
  # only one of them emits is still a warning worth reading. If that ever
  # becomes noise rather than signal, pin a version here rather than dropping
  # the job.
  # ---------------------------------------------------------------------------
  test:
    name: Build and test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cc: gcc
            cxx: g++
            packages: ""
          - cc: clang
            cxx: clang++
            packages: clang
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup
        with:
          packages: ${{ matrix.packages }}

      - name: Build
        working-directory: compress
        run: make -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      # `make test` depends on this, but running it as its own step reports a
      # namespace regression as a namespace regression rather than as a test
      # failure at the bottom of a long log.
      - name: Symbol namespace gate
        working-directory: compress
        run: make check-symbols CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      - name: Tests
        working-directory: compress
        run: make test -j"$(nproc)" CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      - name: Examples
        working-directory: compress
        run: make examples CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      # The tests reach the library through include/ and a static archive
      # linked with --whole-archive. A consumer reaches it through pkg-config,
      # the installed headers and the shared library, and nothing else here
      # exercises that path - which is where CONVENTIONS.md section 1 records
      # three defects that every in-tree build was blind to.
      - name: Install
        working-directory: compress
        run: make install CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} PREFIX="$PREFIX"

      - name: A consumer can use what was installed
        working-directory: compress
        run: CC=${{ matrix.cc }} CXX=${{ matrix.cxx }} tools/check-install.sh "$PREFIX"

  # ---------------------------------------------------------------------------
  # ASan and UBSan, in their own build directory so the objects are never
  # shared with the plain build.
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup

      - name: Tests under ASan and UBSan
        working-directory: compress
        run: make test-asan -j"$(nproc)" PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # ThreadSanitizer, in a third build directory: it cannot share objects with
  # the ASan build because the two sanitizers cannot be combined.
  #
  # Neither of the jobs around it looks for a race.  ASan sees a use-after-free
  # only on a run where the timing actually produced one, and a race that a
  # runner happens to win every time leaves nothing behind; valgrind's memcheck
  # does not look for races at all.  Four paths here are threaded - parallel
  # encode and parallel decode, for LZ4 and for Zstandard - and a CI machine is
  # exactly where an interleaving this developer's machine never picks will
  # first show up.
  # ---------------------------------------------------------------------------
  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup

      - name: Tests under ThreadSanitizer
        working-directory: compress
        run: make test-tsan -j"$(nproc)" PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # Valgrind finds what the sanitizers do not: uninitialised reads that happen
  # to be harmless, and leaks in code the sanitizers' interceptors do not see.
  # The -quiet variant is the one that treats a leak as a failure.
  # ---------------------------------------------------------------------------
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup
        with:
          packages: valgrind

      - name: Build
        working-directory: compress
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Tests under Valgrind
        working-directory: compress
        run: make test-valgrind-quiet PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # The tracked regression corpus, replayed through every harness.
  #
  # This is not fuzzing: fuzz/regression is read-only and the target fails if
  # replaying it changes the directory. It is the cheapest gate in the file
  # and the one that catches a reintroduced parser defect, because every input
  # in there is one that found something once.
  #
  # AFL_CC=clang rather than afl-clang-fast: a replay never mutates anything,
  # so the instrumentation afl-fuzz needs buys nothing here, and the everyday
  # gate stays free of the AFL toolchain. The harnesses are still built with
  # ASan and UBSan, which is what makes a bad read a failure rather than a
  # silent success. A real campaign needs afl-fuzz and a corpus that persists
  # between runs; see documentation/testing/fuzzing.md.
  # ---------------------------------------------------------------------------
  fuzz-replay:
    name: Fuzz corpus replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup
        with:
          packages: clang

      - name: Replay the tracked corpus
        working-directory: compress
        run: make fuzz-replay -j"$(nproc)" AFL_CC=clang PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # The oracles, against pinned references rather than against the runner.
  #
  # Every other job here installs `zstd`, `liblz4` and `pyzstd` with whatever
  # version the runner's archive happens to carry that week, and nothing records
  # what that was - so a reference that changes an answer arrives as a failure
  # in this library, and one that is already wrong for the comparison stays
  # wrong quietly. This job runs the same nine oracle suites against the
  # versions tools/oracle/containers/IMAGES names, and a skip in there is a
  # failure rather than a fact about the machine.
  #
  # The pins do not expire. apt is pointed at snapshot.debian.org, at the date
  # the base image records in its own sources file, so an exact version resolves
  # indefinitely instead of until the archive drops it. Raising a pin is then a
  # deliberate edit - the Containerfile and IMAGES together, having read what the
  # new version changed - rather than something the calendar forces.
  #
  # The cost of that choice is a dependency on one service that is sometimes
  # slow. If this job starts failing on fetches rather than on tests, that is
  # where to look first, and the answer is a retry rather than a pin change.
  #
  # The binaries are built on the runner and only *run* in the image, so this
  # pins the references and not the build. Ubuntu's glibc is older than
  # trixie's, which is the direction that works.
  # ---------------------------------------------------------------------------
  oracles:
    name: Oracles (pinned references)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup

      - name: Build the pinned reference image
        working-directory: compress
        run: make oracle-build

      - name: Name every reference and its version
        working-directory: compress
        run: make oracle-version

      - name: Run the oracle suites against the pinned set
        working-directory: compress
        run: make check-oracle -j"$(nproc)" PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # A floor, so that coverage can only be argued upward. Raise it when the
  # number rises; do not lower it to make a branch pass.
  #
  # The suite reaches 82.2% as of this commit and the floor is 80: the report
  # counts every line of src/, including the Windows branches a Linux runner
  # cannot execute, so the number will never approach 100. It is a ratchet with
  # a little slack, not a target.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: ./compress/.github/actions/setup

      - name: Line coverage
        working-directory: compress
        run: make coverage -j"$(nproc)" COVERAGE_MIN=80 PREFIX="$PREFIX"

  # ---------------------------------------------------------------------------
  # Windows, natively, under MSYS2.
  #
  # The port itself was done and verified by hand in September 2026: compress builds as a DLL under
  # MINGW64, installs, is consumed through pkg-config alone, and 110 of its 112
  # suites passed from a plain shell with nothing arranged by hand - the other
  # two being the pyzstd oracle-availability tests, correctly reporting that
  # pyzstd was not installed on that machine.
  #
  # This job exists because that was a thing a person confirmed once. Every
  # other job here is ubuntu-latest, so nothing stopped the next commit from
  # breaking the port silently; a `_WIN32` branch is exactly the kind of code
  # that rots unbuilt (CONVENTIONS.md section 1's argument for having no second
  # resolution path applies to platforms too). The value is the build and the
  # tests, not the discovery of new portability work.
  #
  # Notes on the shape, each of which is a thing that does not work otherwise:
  #
  # - `shell: msys2 {0}` on every step. The default shell on a Windows runner
  #   is PowerShell, and these recipes are POSIX shell.
  # - MSYS `make` and `diffutils`, not the MinGW ones. The recipes are POSIX
  #   shell, and every flag stamp uses `cmp`; without diffutils `cmp` is absent
  #   and the stamps never compare equal, so everything rebuilds every time.
  # - `pkgconf` from the MINGW64 prefix rather than MSYS's own pkg-config,
  #   which cannot see MINGW64's .pc files - gtest included.
  # - PREFIX converted with `cygpath`. github.workspace is a Windows path
  #   (D:\a\...), and make, pkg-config and the recipes all want a POSIX one, so
  #   it is converted once here rather than in each recipe.
  # - pyzstd from pip. There is no MSYS2 package for it, and without it the two
  #   seekable oracle tests fail rather than skip - deliberately, because a
  #   skipped oracle test and an absent one look identical in a summary line.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MSYS2 MINGW64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          path: compress

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # Required set first, then what the oracle tests compare against.
          # windows-setup.sh in the workspace is the authority on the suite's
          # full list; this is the subset compress alone needs.
          install: >-
            make
            diffutils
            gzip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtest
            mingw-w64-x86_64-python
            mingw-w64-x86_64-python-pip
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-lz4

      # The zstd seekable oracle. No MSYS2 package exists, so pip it; and fail
      # the job if it did not arrive, rather than letting the two tests that
      # need it report the absence further down.
      - name: Install pyzstd
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyzstd
          python -c "from pyzstd import SeekableZstdFile; print('pyzstd ok')"

      - name: Resolve the prefix as a POSIX path
        run: |
          prefix="$(cygpath -u '${{ github.workspace }}')/.local"
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/share/pkgconfig" >> "$GITHUB_ENV"

      # Unpinned, for the same reason the Linux setup action leaves it
      # unpinned: a library is expected to build against its dependency's tip.
      - uses: actions/checkout@v4
        with:
          repository: Ghoti-io/CUtil
          path: cutil

      - name: Build and install cutil
        working-directory: cutil
        run: |
          make -j"$(nproc)" PREFIX="$PREFIX"
          make install PREFIX="$PREFIX"

      - uses: actions/checkout@v4
        with:
          repository: Ghoti-io/security
          path: security

      - name: Build and install security
        working-directory: security
        run: |
          make -j"$(nproc)" PREFIX="$PREFIX"
          make install PREFIX="$PREFIX"

      - name: Build
        working-directory: compress
        run: make -j"$(nproc)" PREFIX="$PREFIX"

      - name: Symbol namespace gate
        working-directory: compress
        run: make check-symbols PREFIX="$PREFIX"

      - name: Tests
        working-directory: compress
        run: make test -j"$(nproc)" PREFIX="$PREFIX"

      - name: Examples
        working-directory: compress
        run: make examples PREFIX="$PREFIX"

      # The same argument as on Linux: the tests reach the library through
      # include/ and an archive, a consumer reaches it through pkg-config, the
      # installed headers and the DLL. On Windows the DLL also has to be found
      # at run time, which is a different mechanism from an rpath and so is
      # worth exercising here specifically.
      - name: Install
        working-directory: compress
        run: make install PREFIX="$PREFIX"

      - name: A consumer can use what was installed
        working-directory: compress
        run: tools/check-install.sh "$PREFIX"
